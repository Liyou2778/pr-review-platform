name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests+bench (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite
            test_url: ""
          - db: postgres
            test_url: postgresql+asyncpg://prreview:prreview@127.0.0.1:5432/prreview_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prreview
          POSTGRES_PASSWORD: prreview
          POSTGRES_DB: prreview_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prreview -d prreview_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
      # conftest prefers TEST_DATABASE_URL; without it the matrix would just
      # run SQLite twice (which is exactly the bug this comment prevents).
      TEST_DATABASE_URL: ${{ matrix.test_url }}
      QUEUE_BACKEND: memory
      GITHUB_DRY_RUN: "true"
      OCR_MODE: fake
      RULES_DIR: ./rules
      GITHUB_WEBHOOK_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Lint
        run: ruff check core apps tests scripts

      - name: Contract tests (${{ matrix.db }})
        run: pytest -q

      # Deterministic layer: must stay perfect, any drop blocks the merge.
      - name: Bench (rules engine)
        run: python scripts/bench.py --out eval/bench/last-run.json

      - name: Gate (rules)
        run: |
          python scripts/gate.py \
            --current eval/bench/last-run.json \
            --baseline eval/bench/baseline.json \
            --max-f1-drop 0.01 \
            --min-f1 0.95

      # Model layer: replayed from a recorded real OCR run, so CI needs no key.
      - name: Bench (recorded OCR)
        run: python scripts/bench.py --engine recorded --out eval/bench/ocr-last-run.json

      - name: Gate (recorded OCR)
        run: |
          python scripts/gate.py \
            --current eval/bench/ocr-last-run.json \
            --baseline eval/bench/ocr-run.json \
            --max-f1-drop 0.03 \
            --min-f1 0.70

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pr-review-platform:ci .
      - name: Smoke the entrypoint
        run: |
          docker run --rm pr-review-platform:ci python -c "import apps.api.main, apps.worker.main; print('imports ok')"
