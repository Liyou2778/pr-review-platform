[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit: the repo has several top-level dirs (rules/, tests/, scripts/),
# so auto-discovery would fail or ship the wrong things.
packages = ["apps", "apps.api", "apps.worker", "core", "core.adapters"]

[project]
name = "pr-review-platform"
version = "0.1.0"
description = "Organization-level AI pull-request review platform (webhook -> queue -> review -> findings -> feedback loop)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# FastAPI's dependency-injection idiom is `param = Depends(...)` in signatures.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
# Server-rendered dashboard keeps one HTML row per source line on purpose.
"apps/api/main.py" = ["E501"]
